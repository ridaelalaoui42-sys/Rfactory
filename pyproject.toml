[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge-ai"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2,<3", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
speech = ["faster-whisper>=1.0,<2"]
publish = ["google-api-python-client>=2,<3", "google-auth>=2,<4", "requests>=2.31,<3"]

[project.scripts]
clipforge = "clipforge.cli:main"

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.setuptools.package-data]
clipforge = ["static/*.html"]
