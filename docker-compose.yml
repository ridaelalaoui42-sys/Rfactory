services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CLIPFORGE_API_TOKEN: ${CLIPFORGE_API_TOKEN:?Set a strong CLIPFORGE_API_TOKEN in your environment}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - clipforge_data:/app/data
      - ./media:/app/media:ro
      - clipforge_out:/app/out
    restart: unless-stopped

volumes:
  clipforge_data:
  clipforge_out:
