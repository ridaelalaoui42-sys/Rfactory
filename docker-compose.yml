# Working local API deployment. Uses SQLite today; PostgreSQL migration
# and a separate web/Playwright worker are NOT implemented in this release.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RFACTORY_API_TOKEN: ${RFACTORY_API_TOKEN:?Set a strong RFACTORY_API_TOKEN in your environment}
      SQLITE_DB_PATH: /app/storage/factory.db
      BROWSER_AUTOMATION_ENABLED: "false"
      LIVE_PUBLISH_ENABLED: "false"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
