name: Social asset library and repeated-fit reels

on:
  pull_request:
    paths:
      - '.github/workflows/social-reels-qa.yml'
      - 'assets/social/**'
      - 'config/social_reels_preset_2026_10.json'
      - 'scripts/install_social_assets.py'
      - 'scripts/render_social_reels.py'
      - 'scripts/social_reels_from_config.py'
      - 'scripts/social_motion.py'
      - 'scripts/verify_social_reels.py'
      - 'tests/test_social_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Verify bundled original-resolution sticker pack
        run: python -m unittest discover -s tests -p 'test_social_*.py' -v
      - name: Install committed asset library
        run: |
          python -m scripts.install_social_assets assets/social/rfactory_social_assets_compact_v1.zip --dest public/rfactory-social
      - name: Render all 3 reels with exact repeated fits
        run: |
          python -m scripts.social_reels_from_config \
            --settings config/social_reels_preset_2026_10.json \
            --assets public/rfactory-social \
            --out storage/renders/social
      - name: Verify media codecs, durations and five single-frame crossings
        run: python -m scripts.verify_social_reels --out storage/renders/social
      - name: Downloadable MP4 QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: rfactory-social-3-reels
          path: |
            storage/renders/social/*.mp4
            storage/renders/social/*_poster.jpg
            storage/renders/social/*_qa.json
            storage/renders/social/reel_verification.json
          if-no-files-found: error
          retention-days: 30
