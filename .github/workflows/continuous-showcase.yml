name: Continuous-motion 3-variant showcase

on:
  push:
    branches:
      - codex/rfactory-release-import-audit
    paths:
      - scripts/render_continuous_variants.py
      - .github/workflows/continuous-showcase.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install rendering requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Generate all three continuous-motion 12-second full-HD Reels
        run: python -m scripts.render_continuous_variants --duration 12 --count 5
      - name: Check showcase manifest and all three exact-fit events
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=json.loads(Path('storage/showcase_continuous/showcase_manifest.json').read_text())
          assert {x['name'] for x in files} == {'snow_leopard','red_panda','astronaut'}
          for item in files:
              assert item['fit_count']==5
              assert len(item['crossing_times_sec'])==5
              assert item['exact_fit_mad']==0.0
              assert item['frame_qa']['passed']
              assert item['frame_qa']['frames_checked']==360
              print(item['name'],item['crossing_times_sec'])
          PY
      - name: Deliver 3 complete MP4s, QA, and source artwork
        uses: actions/upload-artifact@v4
        with:
          name: rfactory-continuous-three-variants
          path: |
            storage/showcase_continuous/**/*.mp4
            storage/showcase_continuous/**/*.png
            storage/showcase_continuous/**/*.json
            storage/showcase_continuous/showcase_manifest.json
            storage/assets/showcase/*.png
          if-no-files-found: error
          retention-days: 14
