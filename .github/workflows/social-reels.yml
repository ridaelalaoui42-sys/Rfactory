name: Social puzzle reels — reproducible assets and QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/social/rfactory_social_assets_compact_v1.zip'
      - 'config/social_reels_preset_2026_10.json'
      - 'scripts/social_motion.py'
      - 'scripts/render_social_reels.py'
      - 'scripts/social_reels_from_config.py'
      - 'scripts/install_social_assets.py'
      - 'tests/test_social_motion.py'
      - '.github/workflows/social-reels.yml'
  pull_request:
    paths:
      - 'assets/social/rfactory_social_assets_compact_v1.zip'
      - 'config/social_reels_preset_2026_10.json'
      - 'scripts/social_motion.py'
      - 'scripts/render_social_reels.py'
      - 'scripts/social_reels_from_config.py'
      - 'scripts/install_social_assets.py'
      - 'tests/test_social_motion.py'
      - '.github/workflows/social-reels.yml'

permissions:
  contents: read

concurrency:
  group: social-reels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image and codec dependencies
        run: |
          python -m pip install 'Pillow>=10,<13' 'numpy>=1.24,<3'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Validate versioned artwork and 3 complete presets
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          pack=Path('assets/social/rfactory_social_assets_compact_v1.zip')
          assert pack.is_file(), 'GitHub asset archive is missing'
          with zipfile.ZipFile(pack) as z:
              bad=z.testzip()
              assert bad is None, f'ZIP corruption: {bad}'
              names=set(z.namelist())
              manifest=json.loads(z.read('asset-catalog.json'))
              entries=manifest['entries']
              assert len(entries)==182, f'Expected 182 cutouts, got {len(entries)}'
              backgrounds=[n for n in names if n.startswith('backgrounds/') and n.endswith('.webp')]
              assert len(backgrounds)==16, f'Expected 16 backgrounds, got {len(backgrounds)}'
              ids={x['id'] for x in entries}
              for record in entries:
                  path=record['webp']
                  assert path in names, (record['id'], path)
                  assert hashlib.sha256(z.read(path)).hexdigest()==record['sha256'], path
              presets=json.loads(Path('config/social_reels_preset_2026_10.json').read_text())['presets']
              assert len(presets)==3
              for p in presets:
                  assert p['subject'] in ids
                  assert p['sidekick'] in ids
                  assert p['reaction'] in ids
                  assert 'backgrounds/'+p['background'] in names
          print('PASS: 182 checksummed cutouts, 16 backgrounds, three complete video presets')
          PY

      - name: Install reusable GitHub-hosted asset library
        run: |
          python scripts/install_social_assets.py             assets/social/rfactory_social_assets_compact_v1.zip             --dest public/rfactory-social

      - name: Validate five continuous exact-fit crossings per reel
        run: |
          python -m unittest tests.test_social_motion -v
          python - <<'PY'
          from pathlib import Path
          from scripts.social_motion import validate_schedule
          from scripts.social_reels_from_config import load_settings
          settings=load_settings(Path('config/social_reels_preset_2026_10.json'))
          assert len(settings)==3
          for preset in settings:
              report=validate_schedule(preset)
              assert report['fit_count']>=5
              assert report['exact_fit_frames_per_event']==1
              assert report['continuous_motion']
              assert not report['final_frame_solved']
              assert report['no_visual_match_indicators']
              print(preset['name'], 'exact crossing seconds:',report['fit_times_seconds'])
          PY

      - name: Render 3 vertical H.264 / AAC Reels
        run: |
          python -m scripts.social_reels_from_config             --settings config/social_reels_preset_2026_10.json             --assets public/rfactory-social             --out storage/renders/social

      - name: Inspect every real output and QA report
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('storage/renders/social')
          presets=json.loads(Path('config/social_reels_preset_2026_10.json').read_text())['presets']
          for preset in presets:
              name=preset['name']
              mp4=root/f'{name}.mp4'
              qa=root/f'{name}_qa.json'
              assert mp4.is_file() and mp4.stat().st_size>10000, name
              assert qa.is_file(), name
              report=json.loads(qa.read_text())
              motion=report['repeated_alignment']
              assert len(motion['fit_frames'])>=5
              assert motion['pixel_alignment_exact']
              assert motion['exact_fit_frames_per_event']==1
              assert motion['continuous_motion']
              assert motion['no_visual_match_indicators']
              assert not motion['final_frame_solved']
              probe=json.loads(subprocess.check_output([
                  'ffprobe','-v','error','-show_streams','-show_format','-of','json',str(mp4)
              ]))
              videos=[s for s in probe['streams'] if s['codec_type']=='video']
              audio=[s for s in probe['streams'] if s['codec_type']=='audio']
              assert len(videos)==1 and videos[0]['codec_name']=='h264'
              assert (videos[0]['width'],videos[0]['height'])==(1080,1920)
              assert len(audio)==1 and audio[0]['codec_name']=='aac'
              assert abs(float(probe['format']['duration'])-preset['duration'])<0.1
              print(f'PASS {name}: {len(motion["fit_frames"])} exact fits, '
                    f'{preset["duration"]} s, {mp4.stat().st_size} bytes')
          PY

      - name: Upload playable MP4s, posters, motion QA and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: rfactory-social-reels-${{ github.run_number }}
          path: |
            storage/renders/social/*.mp4
            storage/renders/social/*_poster.jpg
            storage/renders/social/*_qa.json
            storage/renders/social/render_report.json
            public/rfactory-social/asset-catalog.json
          if-no-files-found: error
          retention-days: 14
