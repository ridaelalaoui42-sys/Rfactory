<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge Style Engine · Risograph</title>
<style>html,body{margin:0;min-height:100%;background:#101b30;color:#eff3fe;font:15px system-ui}main{display:grid;gap:15px;justify-items:center;padding:17px}.top{width:min(1024px,95vw);display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{border-radius:100px;background:#293659;padding:6px 13px;font-weight:700;color:#fce052}canvas{display:block;max-width:95vw;max-height:76vh;object-fit:contain;box-shadow:0 20px 50px #0008;background:#eee6d3}.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px}button,select,input::file-selector-button{background:#f9d93a;color:#162145;border:0;border-radius:8px;padding:11px 13px;cursor:pointer;font-weight:800}input[type=range]{width:min(430px,50vw);accent-color:#f83a92}label{cursor:pointer}p{opacity:.75;font-size:13px;margin:0;text-align:center}</style></head><body>
<main><div class="top"><strong>CLIPFORGE / STYLE ENGINE</strong><span class="pill">RISOGRAPH / LIVE CODE</span></div>
<canvas id="stage" width="1280" height="720" aria-label="Risograph animation preview"></canvas>
<div class="controls"><button id="toggle">▶ PLAY</button><input type="range" id="scrub" min="0" max="15" value="0" step="0.01"><output id="time">0.00 / 15.00</output><label><input id="sfx" type="checkbox" checked> Sound</label><label><input id="loop" type="checkbox" checked> Loop</label><select id="format"><option value="horizontal">16:9</option><option value="vertical">9:16</option><option value="square">1:1</option></select><label><button id="loadBtn">Load voiceover</button><input type="file" accept="audio/*" id="voice" hidden></label></div>
<p>Every frame comes from deterministic time-based ink layers. No copyrighted third-party imagery is bundled.</p><audio id="audio" preload="metadata"></audio>
</main><script src="harness.js"></script><script src="styles/risograph.js"></script><script src="sound.js"></script><script src="player.js"></script></body></html>
