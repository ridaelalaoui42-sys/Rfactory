<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge · Risograph storyboard</title><style>body{background:#141d30;color:#f7f3e8;font-family:system-ui;margin:24px}h1{font-size:28px}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:17px}article{background:#263250;border-radius:12px;padding:10px;box-shadow:0 12px 27px #0004}canvas{width:100%;aspect-ratio:16/9;object-fit:contain}h2{font-size:17px;margin:10px 0 4px}p{font-size:13px;margin:4px 0;color:#dfddea}small{color:#ffdf75}</style></head><body><h1>RISOGRAPH · Visual storyboard</h1><p>Six narrative beats · three scenes · printmaking transitions · procedural sound events</p><div id="grid"></div><script src="harness.js"></script><script src="styles/risograph.js"></script><script>
const root=document.querySelector('#grid');for(const beat of RISO.beats){const a=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=960;canvas.height=540;RISO.draw(canvas.getContext('2d'),960,540,Math.min(14.5,beat.end-.3));const title=document.createElement('h2');title.textContent=`BEAT ${beat.id} · ${beat.text}`;const p=document.createElement('p');p.textContent=beat.description;const note=document.createElement('small');note.textContent=`${beat.start.toFixed(2)}s → ${beat.end.toFixed(2)}s · Sound: ${beat.sound}`;a.append(canvas,title,p,note);root.append(a);}window.renderReady=true;</script></body></html>
